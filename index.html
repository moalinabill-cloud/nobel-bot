<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوبل بات - دستیار هوشمند ریاضی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* فونت ایران یکان */
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebRegular.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebBold.woff2') format('woff2');
            font-weight: bold;
        }

        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1e1b4b;
            --text-muted: #6b7280;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'iranyekan', Tahoma, sans-serif;
        }

        /* پس‌زمینه متحرک (گرادیان) */
        body {
            background: linear-gradient(-45deg, #e0e7ff, #c7d2fe, #a5b4fc, #818cf8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کادر شیشه‌ای ثابت */
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.65);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* انیمیشن آیکون ربات */
        .header h1 i {
            animation: botPulse 2s infinite ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes botPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-10deg); }
            50% { transform: scale(1.15) rotate(0deg); }
            75% { transform: scale(1.1) rotate(10deg); }
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px;
            border-radius: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-muted);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .tab-btn:hover { color: var(--primary); }
        .tab-btn:hover i { transform: scale(1.15) translateY(-2px); }

        .tab-btn.active {
            background: #fff;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.15);
        }

        /* محتوای تب با انیمیشن Slide Up Fade */
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* فرم‌ها و ورودی‌ها */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid transparent;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-dark);
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
        }

        .dual-inputs { display: flex; gap: 15px; }
        .dual-inputs .input-group { flex: 1; }

        /* نتایج و پاپ‌آپ فنری */
        .result-box {
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px dashed rgba(79, 70, 229, 0.4);
            border-radius: 16px;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 20px;
            transition: all 0.3s;
            display: none;
        }

        .result-box.show-anim {
            display: block;
            animation: springPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
        }

        @keyframes springPop {
            0% { transform: scale(0.85); opacity: 0; }
            60% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
        }

        /* دکمه تپنده و نوری */
        .main-action-btn {
            position: relative;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }

        .main-action-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .main-action-btn:hover { transform: translateY(-3px); }
        .main-action-btn:active { transform: translateY(1px); }

        /* استایل‌های غربال */
        .sieve-warning {
            background: rgba(255, 243, 205, 0.8);
            color: #856404;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 4px solid #ffeeba;
        }

        .sieve-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary);
            transition: color 0.5s, transform 0.5s;
        }

        /* چیدمان اعداد از چپ به راست */
        .num-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            direction: ltr; /* LTR Setup */
            justify-content: flex-start;
        }

        .num-item {
            padding: 10px;
            min-width: 45px;
            text-align: center;
            background: rgba(156, 163, 175, 0.8);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .num-item.prime-glow {
            background: var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
            transform: scale(1.15);
            z-index: 10;
        }

        /* انیمیشن محو شدن با چرخش 360 */
        .fly-away {
            transform: translateY(-200px) rotate(360deg) scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* کارت ویدیو آپارات */
        .video-card {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.5), 0 5px 15px rgba(0,0,0,0.05);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* فوتر */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(30, 27, 75, 0.5);
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-robot"></i> نوبل بات</h1>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">
            <i class="fa-solid fa-hashtag"></i> اول و مرکب
        </button>
        <button class="tab-btn" onclick="switchTab(1)">
            <i class="fa-solid fa-divide"></i> ب.م.م
        </button>
        <button class="tab-btn" onclick="switchTab(2)">
            <i class="fa-solid fa-layer-group"></i> ک.م.م
        </button>
        <button class="tab-btn" onclick="switchTab(3)">
            <i class="fa-solid fa-wand-magic-sparkles"></i> غربال
        </button>
    </div>

    <!-- بخش اول و مرکب -->
    <div class="tab-content active" id="tab-0">
        <div class="input-group">
            <i class="fa-solid fa-pen"></i>
            <input type="text" id="numInput" placeholder="یک عدد وارد کنید (مثلاً 97)">
        </div>
        <div class="result-box" id="result-0"></div>
    </div>

    <!-- بخش ب.م.م -->
    <div class="tab-content" id="tab-1">
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-1"></i>
                <input type="text" id="bmmInput1" placeholder="عدد اول">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-2"></i>
                <input type="text" id="bmmInput2" placeholder="عدد دوم">
            </div>
        </div>
        <div class="result-box" id="result-1"></div>
    </div>

    <!-- بخش ک.م.م -->
    <div class="tab-content" id="tab-2">
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-1"></i>
                <input type="text" id="kmmInput1" placeholder="عدد اول">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-2"></i>
                <input type="text" id="kmmInput2" placeholder="عدد دوم">
            </div>
        </div>
        <div class="result-box" id="result-2"></div>
    </div>

    <!-- بخش غربال -->
    <div class="tab-content" id="tab-3">
        <div class="sieve-warning">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>
                <strong>نکته :</strong> حداکثر اختلاف مجاز بین دو عدد ، 1000 میباشد.<br>
                <strong>نکته :</strong> عدد قسمت سمت راست باید کوچک تر از قسمت سمت چپ باشد.
            </div>
        </div>
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-play"></i>
                <input type="text" id="sieveStart" placeholder="عدد شروع (کوچک)">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-stop"></i>
                <input type="text" id="sieveEnd" placeholder="عدد پایان (بزرگ)">
            </div>
        </div>
        <div class="result-box" id="result-3"></div>
    </div>

    <button class="main-action-btn" onclick="executeCurrentTab()">
        <i id="btnIcon" class="fa-solid fa-magnifying-glass-chart"></i> 
        <span id="btnText">بررسی عدد</span>
    </button>
    
    <div class="footer">powered by M.Ali Nabil</div>
</div>

<script>
    let currentTabIndex = 0;

    // پاکسازی اعداد فارسی به انگلیسی
    function cleanNumber(str) {
        if (!str) return "";
        return str.toString().trim()
            .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
            .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    }

    // تغییر تب‌ها
    function switchTab(index) {
        currentTabIndex = index;
        const buttons = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
            contents[idx].classList.toggle('active', idx === index);
        });

        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (index === 0) {
            btnText.innerText = "بررسی عدد";
            btnIcon.className = "fa-solid fa-magnifying-glass-chart";
        } else if (index === 1) {
            btnText.innerText = "محاسبه ب.م.م";
            btnIcon.className = "fa-solid fa-calculator";
        } else if (index === 2) {
            btnText.innerText = "محاسبه ک.م.م";
            btnIcon.className = "fa-solid fa-calculator";
        } else if (index === 3) {
            btnText.innerText = "اجرای جادوی غربال";
            btnIcon.className = "fa-solid fa-wand-magic-sparkles";
        }
        
        // مخفی کردن کادرهای نتایج با تغییر تب
        document.querySelectorAll('.result-box').forEach(box => {
            box.classList.remove('show-anim');
            box.style.display = 'none';
        });
    }

    // تریگر کردن انیمیشن کادر نتیجه
    function triggerResultAnim(boxId) {
        const box = document.getElementById(boxId);
        box.classList.remove('show-anim');
        box.style.display = 'none';
        void box.offsetWidth; // Force Reflow
        box.style.display = 'block';
        box.classList.add('show-anim');
    }

    // اجرای عملیات تب جاری
    function executeCurrentTab() {
        if (currentTabIndex === 0) checkPrime();
        else if (currentTabIndex === 1) calcBMM();
        else if (currentTabIndex === 2) calcKMM();
        else if (currentTabIndex === 3) runAnimatedSieve();
    }

    // توابع ریاضی با BigInt برای امنیت اعداد بزرگ
    function isProbablePrime(n) {
        if (n === 2n || n === 3n) return true;
        if (n < 2n || n % 2n === 0n) return false;
        let d = n - 1n, s = 0n;
        while (d % 2n === 0n) { d /= 2n; s += 1n; }
        const bases = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n];
        for (let a of bases) {
            if (n <= a) break;
            let x = powerMod(a, d, n);
            if (x === 1n || x === n - 1n) continue;
            let composite = true;
            for (let r = 1n; r < s; r++) {
                x = powerMod(x, 2n, n);
                if (x === n - 1n) { composite = false; break; }
            }
            if (composite) return false;
        }
        return true;
    }
    
    function powerMod(base, exp, mod) {
        let res = 1n;
        base = base % mod;
        while (exp > 0n) {
            if (exp % 2n === 1n) res = (res * base) % mod;
            base = (base * base) % mod;
            exp /= 2n;
        }
        return res;
    }
    
    function getPrimeFactors(n) {
        let factors = [], temp = n;
        while (temp % 2n === 0n) { factors.push(2n); temp /= 2n; }
        let d = 3n;
        while (d * d <= temp && temp > 1n) {
            if (temp % d === 0n) { factors.push(d); temp /= d; } 
            else { d += 2n; }
        }
        if (temp > 1n) factors.push(temp);
        return factors.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
    
    function gcdBigInt(a, b) {
        while (b !== 0n) { let t = b; b = a % b; a = t; }
        return a;
    }
    
    function isPrimeSimple(n) {
        if (n < 2) return false;
        for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
        return true;
    }

    // عملکرد تب اول و مرکب
    function checkPrime() {
        let val = cleanNumber(document.getElementById('numInput').value);
        let res = document.getElementById('result-0');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه بررسی:</div>`;
        
        if (!val || isNaN(val)) {
            res.innerHTML = tTitle + "لطفاً یک عدد معتبر وارد کنید.";
            triggerResultAnim('result-0');
            return;
        }
        
        let n = BigInt(val);
        let contentHTML = "";
        
        if (n <= 1n) {
            contentHTML = `عدد ${n} نه اول است و نه مرکب.`;
        } else if (isProbablePrime(n)) {
            contentHTML = `عدد <b style="font-size:18px; color:var(--primary);">${n}</b> یک <b style="color:var(--success); font-size:18px;">عدد اول</b> است.`;
        } else {
            let factors = getPrimeFactors(n);
            contentHTML = `عدد <b style="font-size:18px; color:var(--primary);">${n}</b> یک <b>عدد مرکب</b> است.<br><br>` +
                `<b>تجزیه به عوامل اول:</b> <span style="direction:ltr; display:inline-block;">${factors.join(' × ')}</span>`;
        }
        
        // ویدیوی آپارات اول و مرکب
        let videoCard = `
            <div class="video-card">
                <p style="font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 13px;">
                    <i class="fa-solid fa-clapperboard" style="color: #ed143d; font-size: 16px; vertical-align: -2px; margin-left: 5px;"></i> 
                    اگه میخوای خودت بتونی اعداد اول و مرکب رو تشخیص بدی این ویدیو رو ببین:
                </p>
                <div class="video-wrapper">
                    <iframe src="https://www.aparat.com/video/video/embed/videohash/hydjqz3/vt/frame" allowFullScreen="true"></iframe>
                </div>
            </div>`;
            
        res.innerHTML = tTitle + contentHTML + videoCard;
        triggerResultAnim('result-0');
    }

    // عملکرد تب ب.م.م
    function calcBMM() {
        let aStr = cleanNumber(document.getElementById('bmmInput1').value);
        let bStr = cleanNumber(document.getElementById('bmmInput2').value);
        let res = document.getElementById('result-1');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه ب.م.م:</div>`;
        
        if (!aStr || !bStr) {
            res.innerHTML = tTitle + "لطفاً هر دو عدد را وارد کنید.";
            triggerResultAnim('result-1');
            return;
        }
        
        let a = BigInt(aStr), b = BigInt(bStr);
        let g = gcdBigInt(a, b);
        
        // ویدیوی آپارات ب.م.م
        let videoCard = `
            <div class="video-card">
                <p style="font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 13px;">
                    <i class="fa-solid fa-clapperboard" style="color: #ed143d; font-size: 16px; vertical-align: -2px; margin-left: 5px;"></i> 
                    اگه میخوای یاد بگیری چطور خودت ب.م.م هر عددی رو حساب کنی این ویدیو رو ببین
                </p>
                <div class="video-wrapper">
                    <iframe src="https://www.aparat.com/video/video/embed/videohash/ldz5eaf/vt/frame" allowFullScreen="true"></iframe>
                </div>
            </div>`;
            
        res.innerHTML = tTitle + `بزرگ‌ترین مقسوم‌علیه مشترک (${a} , ${b}) برابر است با: <br><br><div style="font-size:28px; color:var(--primary); text-align:center; font-weight:bold; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(79,70,229,0.3);">${g}</div>` + videoCard;
        triggerResultAnim('result-1');
    }

    // عملکرد تب ک.م.م
    function calcKMM() {
        let aStr = cleanNumber(document.getElementById('kmmInput1').value);
        let bStr = cleanNumber(document.getElementById('kmmInput2').value);
        let res = document.getElementById('result-2');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه ک.م.م:</div>`;
        
        if (!aStr || !bStr) {
            res.innerHTML = tTitle + "لطفاً هر دو عدد را وارد کنید.";
            triggerResultAnim('result-2');
            return;
        }
        
        let a = BigInt(aStr), b = BigInt(bStr);
        let g = gcdBigInt(a, b);
        let k = (a * b) / g;
        
        // ویدیوی آپارات ک.م.م
        let videoCard = `
            <div class="video-card">
                <p style="font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 13px;">
                    <i class="fa-solid fa-clapperboard" style="color: #ed143d; font-size: 16px; vertical-align: -2px; margin-left: 5px;"></i> 
                    اگه میخوای خودت بتونی ک.م.م اعداد مختلف رو بدست بیاری این ویدیو رو ببین
                </p>
                <div class="video-wrapper">
                    <iframe src="https://www.aparat.com/video/video/embed/videohash/xhcsubj/vt/frame" allowFullScreen="true"></iframe>
                </div>
            </div>`;
            
        res.innerHTML = tTitle + `کوچک‌ترین مضرب مشترک [${a} , ${b}] برابر است با: <br><br><div style="font-size:28px; color:var(--primary); text-align:center; font-weight:bold; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(79,70,229,0.3);">${k}</div>` + videoCard;
        triggerResultAnim('result-2');
    }

    // الگوریتم غربال انیمیشنی
    function runAnimatedSieve() {
        let start = parseInt(cleanNumber(document.getElementById('sieveStart').value));
        let end = parseInt(cleanNumber(document.getElementById('sieveEnd').value));
        let res = document.getElementById('result-3');
        triggerResultAnim('result-3');
        
        if (isNaN(start) || isNaN(end) || start > end || start < 1) {
            res.innerHTML = `<div class="result-title"><i class="fa-solid fa-triangle-exclamation"></i> خطا:</div> لطفاً دقت کنید: عدد قسمت سمت راست باید کوچک تر از قسمت سمت چپ باشد.`;
            return;
        }
        
        if (end - start > 1000) {
            res.innerHTML = `<div class="result-title" style="color:#e11d48;"><i class="fa-solid fa-ban"></i> محدودیت:</div> طبق نکته اول، حداکثر اختلاف مجاز بین دو عدد ، 1000 میباشد.`;
            return;
        }

        res.innerHTML = `
            <div id="sieveTitle" class="sieve-title"><i class="fa-solid fa-cubes"></i> اعداد طبیعی</div>
            <div id="numGrid" class="num-grid"></div>
            <div id="sieveVideo" style="display: none; opacity: 0; transition: opacity 0.8s ease;">
                <div class="video-card">
                    <p style="font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 14px;">
                        <i class="fa-solid fa-clapperboard" style="color: #ed143d; font-size: 18px; vertical-align: -2px; margin-left: 5px;"></i> 
                        اگه میخوای خودت بتونی غربال انجام بدی این ویدیو رو ببین
                    </p>
                    <div class="video-wrapper">
                        <iframe src="https://www.aparat.com/video/video/embed/videohash/mjir865/vt/frame" allowFullScreen="true" webkitallowfullscreen="true" mozallowfullscreen="true"></iframe>
                    </div>
                </div>
            </div>
        `;
        
        let grid = document.getElementById('numGrid');
        let title = document.getElementById('sieveTitle');
        let elements = [];

        for (let i = start; i <= end; i++) {
            let span = document.createElement('span');
            span.className = 'num-item';
            span.innerText = i;
            grid.appendChild(span);
            elements.push({ el: span, val: i });
        }

        setTimeout(() => {
            elements.forEach((item, index) => {
                setTimeout(() => {
                    if (!isPrimeSimple(item.val)) {
                        item.el.classList.add('fly-away');
                    } else {
                        item.el.classList.add('prime-glow');
                    }
                }, index * (800 / elements.length)); 
            });

            setTimeout(() => {
                elements.forEach(item => {
                    if (!isPrimeSimple(item.val)) {
                        item.el.style.display = 'none';
                    }
                });
                title.innerHTML = `<i class="fa-solid fa-star"></i> اعداد اول`;
                title.style.color = "var(--success)";
                title.style.transform = "scale(1.15)";
                
                // Show video smoothly after animation finishes
                let videoBox = document.getElementById('sieveVideo');
                videoBox.style.display = 'block';
                setTimeout(() => { videoBox.style.opacity = '1'; }, 50);

            }, 1000 + (800)); 

        }, 1200);
    }
</script>
