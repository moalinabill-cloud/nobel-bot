<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوبل بات - دستیار هوشمند ریاضی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebRegular.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebBold.woff2') format('woff2');
            font-weight: bold;
        }

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899; /* رنگ مکمل صورتی برای گرادیان مدرن */
            --card-bg: rgba(255, 255, 255, 0.85); /* حالت شیشه‌ای شفاف */
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --input-border: rgba(229, 231, 235, 0.6);
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'iranyekan', Tahoma, sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            /* پس‌زمینه گرادیان متحرک */
            background: linear-gradient(-45deg, #6366f1, #8b5cf6, #ec4899, #3b82f6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            /* افکت شیشه‌ای (Glassmorphism) */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 32px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .header h1 i {
            margin-left: 8px;
            animation: floatIcon 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes floatIcon {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 18px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: var(--text-muted);
            border-radius: 14px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            /* قرار دادن آیکون بالای متن */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 26px; /* آیکون‌های بزرگتر */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            color: var(--primary);
        }

        .tab-btn:hover i {
            transform: scale(1.2) translateY(-3px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .tab-btn.active i {
            transform: scale(1.1);
        }

        .tab-content {
            display: none;
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            opacity: 0.8;
        }

        .input-group input {
            width: 100%;
            padding: 16px 45px 16px 16px;
            border: 2px solid var(--input-border);
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-group input:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.15);
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2), 0 8px 20px rgba(99, 102, 241, 0.2);
            background: #fff;
            transform: scale(1.02);
        }

        .dual-inputs {
            display: flex;
            gap: 15px;
        }
        
        .dual-inputs .input-group {
            flex: 1;
        }

        .sieve-note {
            background: rgba(254, 226, 226, 0.85);
            color: #ef4444;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            border: 1px dashed #f87171;
            backdrop-filter: blur(5px);
        }

        .result-box {
            padding: 22px;
            background: rgba(248, 250, 252, 0.8);
            border: 2px dashed rgba(203, 213, 225, 0.9);
            border-radius: 16px;
            min-height: 120px;
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: top center;
        }

        .result-box:hover {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .spring-pop {
            animation: springPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes springPop {
            0% { opacity: 0; transform: scale(0.8) translateY(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 4px 30px rgba(236, 72, 153, 0.6); }
            100% { box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        }

        .main-action-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            animation: pulseGlow 2.5s infinite;
        }

        .main-action-btn:hover {
            transform: translateY(-4px) scale(1.02);
            animation: none;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.6);
        }

        .main-action-btn i {
            font-size: 24px;
        }

        .sieve-title {
            text-align: center; font-size: 24px; font-weight: bold;
            margin-bottom: 20px; color: var(--primary);
            transition: color 0.5s, transform 0.5s;
        }
        .num-grid {
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start;
            direction: ltr; /* اعداد چپ به راست */
        }
        .num-item {
            padding: 12px 18px;
            background: rgba(148, 163, 184, 0.95);
            color: white;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 1s ease-in-out, background-color 0.5s, box-shadow 0.5s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-width: 45px;
            opacity: 0;
            transform: scale(0);
            animation: popInItem 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popInItem {
            to { opacity: 1; transform: scale(1); }
        }
        .num-item:hover {
            transform: scale(1.15) translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .fly-away {
            transform: translateY(-250px) scale(0) rotate(360deg) !important;
            opacity: 0;
            pointer-events: none;
        }
        .prime-glow {
            background: var(--success) !important;
            box-shadow: 0 0 15px var(--success), inset 0 0 10px rgba(255,255,255,0.4) !important;
            transform: scale(1.15) !important;
            z-index: 5;
        }

        .footer-credit {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.8;
            margin-top: -5px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-robot"></i> نوبل بات</h1>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">
            <i class="fa-solid fa-cubes"></i> اول و مرکب
        </button>
        <button class="tab-btn" onclick="switchTab(1)">
            <i class="fa-solid fa-divide"></i> ب.م.م
        </button>
        <button class="tab-btn" onclick="switchTab(2)">
            <i class="fa-solid fa-layer-group"></i> ک.م.م
        </button>
        <button class="tab-btn" onclick="switchTab(3)">
            <i class="fa-solid fa-filter"></i> غربال
        </button>
    </div>

    <!-- تب اول و مرکب -->
    <div class="tab-content active" id="tab-0">
        <div class="input-group">
            <i class="fa-solid fa-pen"></i>
            <input type="text" id="numInput" placeholder="یک عدد وارد کنید (مثلاً 97)">
        </div>
        <div class="result-box" id="result-0">
            <div class="result-title"><i class="fa-solid fa-circle-info"></i> نتیجه:</div>
            پاسخ در این قسمت نمایش داده می‌شود...
        </div>
    </div>

    <!-- تب ب.م.م -->
    <div class="tab-content" id="tab-1">
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-1"></i>
                <input type="text" id="bmmInput1" placeholder="عدد اول">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-2"></i>
                <input type="text" id="bmmInput2" placeholder="عدد دوم">
            </div>
        </div>
        <div class="result-box" id="result-1">
            <div class="result-title"><i class="fa-solid fa-circle-info"></i> نتیجه:</div>
            پاسخ در این قسمت نمایش داده می‌شود...
        </div>
    </div>

    <!-- تب ک.م.م -->
    <div class="tab-content" id="tab-2">
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-1"></i>
                <input type="text" id="kmmInput1" placeholder="عدد اول">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-2"></i>
                <input type="text" id="kmmInput2" placeholder="عدد دوم">
            </div>
        </div>
        <div class="result-box" id="result-2">
            <div class="result-title"><i class="fa-solid fa-circle-info"></i> نتیجه:</div>
            پاسخ در این قسمت نمایش داده می‌شود...
        </div>
    </div>

    <!-- تب غربال -->
    <div class="tab-content" id="tab-3">
        <div class="sieve-note">
            <i class="fa-solid fa-circle-exclamation"></i> نکته : حد اکثر اختلاف بین دو عدد تا 1000 است
        </div>
        <div class="dual-inputs">
            <div class="input-group">
                <i class="fa-solid fa-play"></i>
                <input type="text" id="sieveStart" placeholder="عدد شروع (مثلاً 1)">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-stop"></i>
                <input type="text" id="sieveEnd" placeholder="عدد پایان (مثلاً 50)">
            </div>
        </div>
        <div class="result-box" id="result-3">
            <div class="result-title"><i class="fa-solid fa-circle-info"></i> نتیجه:</div>
            پاسخ در این قسمت نمایش داده می‌شود...
        </div>
    </div>

    <button class="main-action-btn" onclick="executeCurrentTab()">
        <i id="btnIcon" class="fa-solid fa-magnifying-glass-chart"></i> 
        <span id="btnText">بررسی عدد</span>
    </button>

    <div class="footer-credit" dir="ltr">powered by M.Ali Nabil</div>
</div>

<script>
    let currentTabIndex = 0;

    function cleanNumber(str) {
        if (!str) return "";
        return str.toString().trim()
            .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
            .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
    }

    function switchTab(index) {
        currentTabIndex = index;
        const buttons = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');
        
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
            contents[idx].classList.toggle('active', idx === index);
        });

        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (index === 0) {
            btnText.innerText = "بررسی عدد";
            btnIcon.className = "fa-solid fa-magnifying-glass-chart";
        } else if (index === 1) {
            btnText.innerText = "محاسبه ب.م.م";
            btnIcon.className = "fa-solid fa-divide";
        } else if (index === 2) {
            btnText.innerText = "محاسبه ک.م.م";
            btnIcon.className = "fa-solid fa-layer-group";
        } else if (index === 3) {
            btnText.innerText = "اجرای جادوی غربال";
            btnIcon.className = "fa-solid fa-wand-magic-sparkles";
        }
    }

    function executeCurrentTab() {
        if (currentTabIndex === 0) checkPrime();
        else if (currentTabIndex === 1) calcBMM();
        else if (currentTabIndex === 2) calcKMM();
        else if (currentTabIndex === 3) runAnimatedSieve();
    }

    function isProbablePrime(n) {
        if (n === 2n || n === 3n) return true;
        if (n < 2n || n % 2n === 0n) return false;
        let d = n - 1n, s = 0n;
        while (d % 2n === 0n) { d /= 2n; s += 1n; }
        const bases = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n];
        for (let a of bases) {
            if (n <= a) break;
            let x = powerMod(a, d, n);
            if (x === 1n || x === n - 1n) continue;
            let composite = true;
            for (let r = 1n; r < s; r++) {
                x = powerMod(x, 2n, n);
                if (x === n - 1n) { composite = false; break; }
            }
            if (composite) return false;
        }
        return true;
    }
    function powerMod(base, exp, mod) {
        let res = 1n;
        base = base % mod;
        while (exp > 0n) {
            if (exp % 2n === 1n) res = (res * base) % mod;
            base = (base * base) % mod;
            exp /= 2n;
        }
        return res;
    }
    function getPrimeFactors(n) {
        let factors = [], temp = n;
        while (temp % 2n === 0n) { factors.push(2n); temp /= 2n; }
        let d = 3n;
        while (d * d <= temp && temp > 1n) {
            if (temp % d === 0n) { factors.push(d); temp /= d; } 
            else { d += 2n; }
        }
        if (temp > 1n) factors.push(temp);
        return factors.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
    function gcdBigInt(a, b) {
        while (b !== 0n) { let t = b; b = a % b; a = t; }
        return a;
    }
    function isPrimeSimple(n) {
        if (n < 2) return false;
        for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
        return true;
    }

    function animateResult(resElement, htmlContent) {
        resElement.classList.remove('spring-pop');
        void resElement.offsetWidth; // ایجاد رفرش در صفحه برای اجرای دوباره انیمیشن
        resElement.innerHTML = htmlContent;
        resElement.classList.add('spring-pop');
    }

    function checkPrime() {
        let val = cleanNumber(document.getElementById('numInput').value);
        let res = document.getElementById('result-0');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه:</div>`;
        if (!val || isNaN(val)) return animateResult(res, tTitle + "لطفاً یک عدد معتبر وارد کنید.");
        let n = BigInt(val);
        if (n <= 1n) return animateResult(res, tTitle + `عدد ${n} نه اول است و نه مرکب.`);
        if (isProbablePrime(n)) {
            animateResult(res, tTitle + `عدد <b>${n}</b> یک <b style="color:var(--success);">عدد اول</b> است.`);
        } else {
            let factors = getPrimeFactors(n);
            let divList = [];
            for (let i = 1n; i <= n; i++) {
                if (n % i === 0n) { divList.push(i); if(divList.length > 100) break; }
            }
            animateResult(res, tTitle + `عدد <b>${n}</b> یک <b>عدد مرکب</b> است.<br><br>` +
                `<b>تجزیه به عوامل اول:</b> ${factors.join(' × ')}<br><br>` +
                `<b>شمارنده‌ها:</b> ${divList.join(', ')} ${divList.length > 100 ? '(...)' : ''}`);
        }
    }

    function calcBMM() {
        let aStr = cleanNumber(document.getElementById('bmmInput1').value);
        let bStr = cleanNumber(document.getElementById('bmmInput2').value);
        let res = document.getElementById('result-1');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه ب.م.م:</div>`;
        if (!aStr || !bStr) return animateResult(res, tTitle + "لطفاً هر دو عدد را وارد کنید.");
        let a = BigInt(aStr), b = BigInt(bStr);
        let g = gcdBigInt(a, b);
        animateResult(res, tTitle + `بزرگ‌ترین مقسوم‌علیه مشترک (${a} , ${b}) برابر است با: <br><br><b style="font-size:20px; color:var(--primary);">${g}</b>`);
    }

    function calcKMM() {
        let aStr = cleanNumber(document.getElementById('kmmInput1').value);
        let bStr = cleanNumber(document.getElementById('kmmInput2').value);
        let res = document.getElementById('result-2');
        let tTitle = `<div class="result-title"><i class="fa-solid fa-check-double"></i> نتیجه ک.م.م:</div>`;
        if (!aStr || !bStr) return animateResult(res, tTitle + "لطفاً هر دو عدد را وارد کنید.");
        let a = BigInt(aStr), b = BigInt(bStr);
        let g = gcdBigInt(a, b);
        let k = (a * b) / g;
        animateResult(res, tTitle + `کوچک‌ترین مضرب مشترک [${a} , ${b}] برابر است با: <br><br><b style="font-size:20px; color:var(--primary);">${k}</b>`);
    }

    function runAnimatedSieve() {
        let start = parseInt(cleanNumber(document.getElementById('sieveStart').value));
        let end = parseInt(cleanNumber(document.getElementById('sieveEnd').value));
        let res = document.getElementById('result-3');
        if (isNaN(start) || isNaN(end) || start > end || start < 1) {
            animateResult(res, `<div class="result-title"><i class="fa-solid fa-triangle-exclamation"></i> خطا:</div> لطفاً بازه معتبری وارد کنید.`);
            return;
        }
        
        if (end - start > 1000) {
            animateResult(res, `<div class="result-title" style="color:#ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> خطا:</div> اختلاف بین دو عدد نباید بیشتر از ۱۰۰۰ باشد.`);
            return;
        }

        animateResult(res, `
            <div id="sieveTitle" class="sieve-title"><i class="fa-solid fa-cubes"></i> اعداد طبیعی</div>
            <div id="numGrid" class="num-grid"></div>
        `);
        
        let grid = document.getElementById('numGrid');
        let title = document.getElementById('sieveTitle');
        let elements = [];
        let staggerDelay = 0; // زمان مکث برای انیمیشن آبشاری ورود

        for (let i = start; i <= end; i++) {
            let span = document.createElement('span');
            span.className = 'num-item';
            span.innerText = i;
            span.style.animationDelay = `${staggerDelay}s`;
            staggerDelay += 0.03;
            grid.appendChild(span);
            elements.push({ el: span, val: i });
        }

        let waitTime = (staggerDelay * 1000) + 800; // صبر تا پایان ورود تمامی اعداد

        setTimeout(() => {
            elements.forEach(item => {
                if (!isPrimeSimple(item.val)) {
                    item.el.classList.add('fly-away');
                } else {
                    item.el.classList.add('prime-glow');
                }
            });

            setTimeout(() => {
                elements.forEach(item => {
                    if (!isPrimeSimple(item.val)) {
                        item.el.style.display = 'none';
                    }
                });
                title.innerHTML = `<i class="fa-solid fa-star"></i> اعداد اول`;
                title.style.color = "var(--success)";
                title.style.transform = "scale(1.1)";
            }, 1200);

        }, waitTime);
    }
</script>

</body>
</html>
