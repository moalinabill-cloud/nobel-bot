<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نوبل بات - دستیار هوشمند ریاضی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* فونت ایران یکان */
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebRegular.woff2') format('woff2');
            font-weight: normal;
        }
        @font-face {
            font-family: 'iranyekan';
            src: url('https://cdn.fontcdn.ir/Font/Persian/IRANYekan/IRANYekanWebBold.woff2') format('woff2');
            font-weight: bold;
        }

        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1e1b4b;
            --text-muted: #6b7280;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'iranyekan', Tahoma, sans-serif;
        }

        /* پس‌زمینه متحرک (گرادیان) */
        body {
            background: linear-gradient(-45deg, #e0e7ff, #c7d2fe, #a5b4fc, #818cf8);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* کادر شیشه‌ای ثابت */
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.65);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            width: 100%;
        }

        .header h1 {
            color: var(--primary);
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0 auto;
        }

        /* انیمیشن آیکون ربات */
        .header h1 i {
            animation: botPulse 2s infinite ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes botPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-10deg); }
            50% { transform: scale(1.15) rotate(0deg); }
            75% { transform: scale(1.1) rotate(10deg); }
        }

        /* تب‌ها */
        .tabs {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px;
            border-radius: 16px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            color: var(--text-muted);
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .tab-btn i {
            font-size: 20px;
            transition: transform 0.3s;
        }

        .tab-btn:hover { color: var(--primary); }
        .tab-btn:hover i { transform: scale(1.15) translateY(-2px); }

        .tab-btn.active {
            background: #fff;
            color: var(--primary);
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.15);
        }

        /* محتوای تب با انیمیشن Slide Up Fade */
        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: slideUpFade 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* فرم‌ها و ورودی‌ها */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            transition: 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 2px solid transparent;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-dark);
            font-weight: bold;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.2);
        }

        .dual-inputs { display: flex; gap: 15px; }
        .dual-inputs .input-group { flex: 1; }

        /* نتایج و پاپ‌آپ فنری */
        .result-box {
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px dashed rgba(79, 70, 229, 0.4);
            border-radius: 16px;
            min-height: 100px;
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-dark);
            margin-bottom: 20px;
            transition: all 0.3s;
            display: none;
        }

        .result-box.show-anim {
            display: block;
            animation: springPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
        }

        @keyframes springPop {
            0% { transform: scale(0.85); opacity: 0; }
            60% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-title {
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
        }
        
        /* دکمه دوباره */
        .reset-btn {
            background: rgba(225, 29, 72, 0.1);
            color: #e11d48;
            border: 1px solid rgba(225, 29, 72, 0.2);
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            gap: 6px;
            align-items: center;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background: #e11d48;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
        }
        
        .reset-btn i {
            transition: transform 0.4s;
        }
        
        .reset-btn:hover i {
            transform: rotate(-180deg);
        }

        /* دکمه تپنده و نوری */
        .main-action-btn {
            position: relative;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }

        .main-action-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .main-action-btn:hover { transform: translateY(-3px); }
        .main-action-btn:active { transform: translateY(1px); }

        /* استایل‌های غربال */
        .sieve-warning {
            background: rgba(255, 243, 205, 0.8);
            color: #856404;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            border-right: 4px solid #ffeeba;
        }

        .sieve-title {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary);
            transition: color 0.5s, transform 0.5s;
        }

        /* چیدمان اعداد از چپ به راست */
        .num-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            direction: ltr; /* LTR Setup */
            justify-content: flex-start;
        }

        .num-item {
            padding: 10px;
            min-width: 45px;
            text-align: center;
            background: rgba(156, 163, 175, 0.8);
            color: white;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .num-item.prime-glow {
            background: var(--success);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
            transform: scale(1.15);
            z-index: 10;
        }

        /* انیمیشن محو شدن با چرخش 360 */
        .fly-away {
            transform: translateY(-200px) rotate(360deg) scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* کارت ویدیو آپارات */
        .video-card {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(255,255,255,0.5), 0 5px 15px rgba(0,0,0,0.05);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: 0;
        }

        /* فوتر */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(30, 27, 75, 0.5);
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        /* ================= اضافه شده برای استایل مسابقات (هماهنگ با تم) ================= */
        .comp-btn {
            background: var(--success);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }
        .comp-btn:hover { background: #059669; transform: translateY(-2px); }
        
        .comp-cards {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px;
        }
        .comp-card {
            background: rgba(255, 255, 255, 0.8); border: 2px solid rgba(79, 70, 229, 0.2);
            padding: 25px 15px; border-radius: 16px; text-align: center; cursor: pointer;
